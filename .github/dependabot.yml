version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    groups:
      monthly-batch:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: monthly
    groups:
      monthly-batch:
        patterns:
          - "*"
    cooldown:
      default-days: 7
